<body>
<div class="app" id="app">
  <!-- Side navigation · LIM Figma "Group 97" (64px, raisin) -->
  <aside class="sidenav">
    <button class="sn-account" id="avatarBtn" data-tip="Max Mustermann" data-tip-pos="right"><img src="assets/fig/avatar.png" alt=""></button>
    <nav class="sn-items" id="snItems"></nav>
  </aside>
  <div class="main">
    <!-- App bar · LIM Figma "app bar/no nesting 1 ECAP 3" -->
    <header class="appbar">
      <button class="ab-project" id="projectBtn">
        <span class="ab-l">Viewing Project:</span>
        <span class="ab-v" id="projectName">Amazon</span>
        <span class="ms s24">keyboard_arrow_down</span>
      </button>
      <span class="sp"></span>
      <img class="ab-logo" src="assets/fig/amberg-logo.svg" alt="Amberg Loglay" width="129" height="28">
    </header>
    <div class="workspace">
      <div class="ribbon" id="ribbon"></div>
      <div class="ws-body">
        <section class="planning" id="planning"><div class="gantt" id="gantt"></div></section>
        <aside class="panel hidden" id="panel"></aside>
      </div>
    </div>
  </div>
</div>
<button class="fab" id="fab" data-tip="Add activity" data-tip-pos="left"><span class="ms s24">add</span></button>
<div id="layer"></div>
<div id="toasts"></div>
<div id="tip" class="tip"></div>
<input type="file" id="importFile" class="hidden" accept=".csv,.xlsx,.xml,.mpp">
